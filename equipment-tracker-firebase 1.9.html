<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Equipment Locator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap">
<style>
:root{--bg:#070b1a;--ink:#e8f1ff;--mute:#7f93b8;--neon:#00e5ff;--neon2:#ff2bd6;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.4 "Rajdhani","Segoe UI",system-ui,sans-serif;
background:radial-gradient(900px 500px at 10% -10%,rgba(0,229,255,.18),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(255,43,214,.16),transparent 60%),radial-gradient(900px 600px at 50% 120%,rgba(120,80,255,.2),transparent 60%),var(--bg);
background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px);background-size:44px 44px;
-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 80%)}
main{position:relative;z-index:1;max-width:1150px;margin:0 auto;padding:18px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font:800 26px/1 "Orbitron","Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0;
background:linear-gradient(90deg,var(--neon),#8a7bff 55%,var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(0,229,255,.55))}
.status{font-size:12px;color:var(--mute);letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#2dff8f;box-shadow:0 0 10px #2dff8f;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
input,select,button{font:inherit;font-weight:600;color:var(--ink);background:rgba(14,22,48,.75);border:1px solid rgba(0,229,255,.35);border-radius:10px;padding:9px 12px;outline:none;backdrop-filter:blur(8px);transition:box-shadow .15s,border-color .15s}
input:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 16px rgba(0,229,255,.45)}
input{flex:1;min-width:150px}
select option{background:#0e1630}
button{cursor:pointer}
button:hover{box-shadow:0 0 14px rgba(0,229,255,.5)}
button.primary{background:linear-gradient(135deg,#00b8ff,#7a5cff 60%,#ff2bd6);border:0;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);box-shadow:0 4px 18px rgba(122,92,255,.55)}
button.danger{color:#ff6b8a;border-color:rgba(255,107,138,.6)}
.find{font-size:14px;color:var(--mute);margin:-4px 0 12px;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;perspective:1300px}
.box{--c:#00e5ff;position:relative;border-radius:16px;padding:12px;min-height:170px;
background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,#0b1230) 0%,rgba(9,14,36,.88) 55%);
border:1px solid color-mix(in srgb,var(--c) 70%,transparent);
box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent),0 0 24px color-mix(in srgb,var(--c) 38%,transparent),0 18px 30px -12px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 40px color-mix(in srgb,var(--c) 10%,transparent);
transform:rotateX(4deg);transform-origin:50% 100%;transition:transform .2s,box-shadow .2s}
.box:hover{transform:rotateX(0) translateY(-4px)}
.box::after{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;border-radius:2px;background:var(--c);box-shadow:0 0 12px var(--c),0 0 24px var(--c)}
.box.over{transform:rotateX(0) translateY(-6px) scale(1.03);box-shadow:0 0 0 2px var(--c),0 0 44px var(--c),0 24px 40px -12px rgba(0,0,0,.8),inset 0 0 60px color-mix(in srgb,var(--c) 30%,transparent)}
.box.tray{grid-column:1/-1;min-height:84px;border-style:dashed;transform:none}
.box.tray:hover{transform:none}
.box h2{font:700 15px "Orbitron","Segoe UI",sans-serif;letter-spacing:.12em;margin:2px 0 11px;display:flex;justify-content:space-between;align-items:baseline;color:var(--c);text-shadow:0 0 12px var(--c)}
.box h2 span{font:600 12px "Rajdhani",sans-serif;letter-spacing:.05em;color:var(--mute);text-shadow:none}
.items{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border-radius:11px;font-weight:700;font-size:14px;cursor:grab;user-select:none;touch-action:none;color:#f2f7ff;
background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 55%),color-mix(in srgb,var(--c) 22%,#0d1430);
border:1px solid color-mix(in srgb,var(--c) 75%,#fff 0%);
box-shadow:0 3px 0 color-mix(in srgb,var(--c) 45%,#000),0 7px 14px rgba(0,0,0,.55),0 0 12px color-mix(in srgb,var(--c) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.35);
transition:transform .12s,box-shadow .12s}
.chip:hover{transform:translateY(-2px);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#000),0 11px 18px rgba(0,0,0,.6),0 0 20px var(--c),inset 0 1px 0 rgba(255,255,255,.4)}
.chip svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--c);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--c))}
.chip.hit{animation:hit 1s ease-in-out infinite;border-color:#ffe45e;color:#fff6c2}
.chip.hit svg{stroke:#ffe45e;filter:drop-shadow(0 0 5px #ffe45e)}
@keyframes hit{50%{box-shadow:0 3px 0 #8a6d00,0 0 30px #ffe45e,0 0 8px #ffe45e}}
.chip.dim{opacity:.3;filter:saturate(.4)}
.chip.lift{opacity:.25}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12) rotate(-4deg);box-shadow:0 14px 30px rgba(0,0,0,.7),0 0 30px var(--c)}
.empty{color:var(--mute);font-size:13px;font-style:italic}
.modal{position:fixed;inset:0;background:rgba(2,4,14,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.panel{background:linear-gradient(160deg,#121b42,#0a1030);border:1px solid var(--neon);border-radius:16px;padding:18px;width:100%;max-width:350px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 40px rgba(0,229,255,.35),0 20px 50px rgba(0,0,0,.7)}
.panel strong{font:700 14px "Orbitron",sans-serif;letter-spacing:.12em;color:var(--neon);text-shadow:0 0 10px var(--neon)}
.panel .row{display:flex;gap:8px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0e1630;border:1px solid var(--neon2);color:#fff;box-shadow:0 0 20px rgba(255,43,214,.5);padding:9px 15px;border-radius:10px;font-size:13px;display:none;z-index:70}
.chip{position:relative}
.chip.note::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:#ff2a3d;border:1px solid #ffb3ba;box-shadow:0 0 6px #ff2a3d,0 0 14px #ff2a3d;animation:pulse 1.8s infinite}
textarea{font:inherit;font-weight:600;color:var(--ink);background:rgba(14,22,48,.75);border:1px solid rgba(0,229,255,.35);border-radius:10px;padding:9px 12px;outline:none;resize:vertical;width:100%}
textarea:focus{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 16px rgba(0,229,255,.45)}
.emo{display:flex;flex-wrap:wrap;gap:4px}
.emo button{padding:3px 7px;font-size:17px;border-radius:8px}
.cart{flex:0 1 auto;min-width:130px;max-width:100%;display:flex;flex-direction:column;gap:4px;padding:4px;border:1px dashed color-mix(in srgb,var(--c) 70%,transparent);border-radius:14px;background:color-mix(in srgb,var(--c) 7%,transparent);transition:box-shadow .15s,background .15s}
.cart.over{background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 0 2px var(--c),0 0 26px var(--c)}
.cart>.chip{align-self:flex-start}
.dock{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-left:8px;padding-left:7px;border-left:2px solid var(--c);min-height:22px}
.dock .chip{font-size:13px;padding:4px 10px 4px 8px}
.dock .hint{font-size:12px;color:var(--mute);font-style:italic}
.lg{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.tick{display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer}
.tick input{flex:none;min-width:0;width:18px;height:18px;padding:0;accent-color:#39ff7a}
.tick input#newVideo,.tick input#editVideo{accent-color:#ff2bd6}
.chip.ka svg{stroke:#39ff7a;filter:drop-shadow(0 0 4px #39ff7a)}
.chip.kv svg{stroke:#ff2bd6;filter:drop-shadow(0 0 4px #ff2bd6)}
.chip.kva svg{stroke:url(#kgrad);filter:drop-shadow(0 0 3px #ff2bd6) drop-shadow(0 0 3px #39ff7a)}
.chip.hit.ka svg,.chip.hit.kv svg,.chip.hit.kva svg{stroke:#ffe45e;filter:drop-shadow(0 0 5px #ffe45e)}
.ghost{will-change:left,top,transform;opacity:.97;transition:none}
.chip.landed{animation:land .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes land{0%{transform:scale(1.4);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}
@media (prefers-reduced-motion:reduce){.chip.landed{animation:none}}
.fn{color:#ffe45e;font-weight:700;text-shadow:0 0 10px rgba(255,228,94,.5)}
.fl{font-weight:700}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="kgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#ff2bd6"/><stop offset="0.5" stop-color="#39ff7a"/></linearGradient></defs></svg>
<main>
  <header>
    <h1>Equipment Locator</h1>
    <div style="display:flex;gap:10px;align-items:center"><span class="lg"><span style="color:#39ff7a;text-shadow:0 0 8px #39ff7a">● Audio</span><span style="color:#ff2bd6;text-shadow:0 0 8px #ff2bd6">● Video</span></span><div class="status" id="status">Connecting…</div><button id="signout" style="display:none;padding:5px 10px;font-size:12px">Sign out</button></div>
  </header>
  <div class="bar">
    <input id="search" type="search" placeholder="Find an item (e.g. Bose3)">
  </div>
  <div class="find" id="find"></div>
  
  <div class="bar">
    <input id="newName" placeholder="New item name">
    <select id="newLoc"></select>
    <label class="tick"><input type="checkbox" id="newAudio"> Audio</label><label class="tick"><input type="checkbox" id="newVideo"> Video</label>
    <button class="primary" id="addBtn">Add item</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal">
  <div class="panel">
    <strong>Edit item</strong>
    <input id="editName">
    <select id="editLoc"></select>
    <select id="editParent" title="Attached to"></select>
    <div style="display:flex;gap:16px"><label class="tick"><input type="checkbox" id="editAudio"> Audio</label><label class="tick"><input type="checkbox" id="editVideo"> Video</label></div>
    <button id="notesBtn" type="button">📝 Notes</button>
    <div class="row">
      <button class="danger" id="delBtn">Delete</button>
      <span style="display:flex;gap:8px"><button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save</button></span>
    </div>
  </div>
</div>
<div class="modal" id="noteModal">
  <div class="panel">
    <strong id="noteTitle">Notes</strong>
    <textarea id="noteText" rows="6" maxlength="1000" placeholder="Add a note… emojis welcome 😀"></textarea>
    <div class="emo" id="emo"></div>
    <div class="row">
      <span style="display:flex;gap:8px"><button class="danger" id="noteClear" type="button">Clear note</button><button id="noteEdit" type="button">EDIT</button></span>
      <span style="display:flex;gap:8px"><button id="noteCancel" type="button">Close</button><button class="primary" id="noteSave" type="button">Save</button></span>
    </div>
  </div>
</div>
<div class="modal on" id="loginModal">
  <div class="panel">
    <strong>Team login</strong>
    <input id="loginEmail" type="email" placeholder="Team email" value="AV@WTFISIT.local" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Team password" autocomplete="current-password">
    <div id="loginErr" style="color:#ff6b8a;font-size:13px;min-height:16px"></div>
    <button class="primary" id="loginBtn">Sign in</button>
  </div>
</div>
<div class="toast" id="toast"></div>

  ch.className="chip"+(isHit?" hit":((q&&!hitKids)?" dim":""))+(it.notes&&it.notes.trim()?" note":"")+(it.id===lastDropped?" landed":"");
  if(it.notes&&it.notes.trim())ch.title=it.notes;
  ch.style.setProperty("--c",itemColor(it.name));ch.innerHTML=iconFor(it.name);if(it.audio||it.video)ch.classList.add(it.audio&&it.video?"kva":it.video?"kv":"ka");
  var lb=document.createElement("span");lb.textContent=it.name;ch.appendChild(lb);ch.dataset.id=it.id;
  attachDrag(ch);return ch;
}
function render(){
  if(dragging){pendingRender=true;return}
  var q=$("search").value.trim().toLowerCase();
  var grid=$("grid");grid.textContent="";
  var list=Object.keys(items).map(function(id){return Object.assign({id:id},items[id])});
  var kids={};
  list.forEach(function(i){var pp=parentOf(i);if(pp){(kids[pp]=kids[pp]||[]).push(i)}});
  Object.keys(kids).forEach(function(k){kids[k].sort(natural)});
  var hits=q?list.filter(function(i){return nameHit(i,q)}):[];
  var places=[UN].concat(LOCS);
  places.forEach(function(loc){
    var box=document.createElement("div");
    box.className="box"+(loc===UN?" tray":"");box.dataset.loc=loc;box.style.setProperty("--c",COL[loc]||"#00e5ff");
    var mine=list.filter(function(i){return !parentOf(i)&&eloc(i)===loc}).sort(natural);
    var total=mine.reduce(function(a,i){return a+1+(kids[i.id]?kids[i.id].length:0)},0);
    var h=document.createElement("h2");
    var n=document.createElement("b");n.textContent=locLabel(loc);
    var c=document.createElement("span");c.textContent=total+(total===1?" item":" items");
    h.appendChild(n);h.appendChild(c);box.appendChild(h);
    var wrap=document.createElement("div");wrap.className="items";
    if(!mine.length){var e=document.createElement("div");e.className="empty";e.textContent=loc===UN?"Drag items here if their location is unknown":"Empty";wrap.appendChild(e)}
    mine.forEach(function(it){
      if(isCart(it)){
        var ks=kids[it.id]||[];
        var w=document.createElement("div");w.className="cart";w.dataset.cart=it.id;w.style.setProperty("--c",itemColor(it.name));
        w.appendChild(mkChip(it,q,ks.some(function(k){return q&&nameHit(k,q)})));
        var dock=document.createElement("div");dock.className="dock";
        ks.forEach(function(k){dock.appendChild(mkChip(k,q,false))});
        if(!ks.length){var ht=document.createElement("span");ht.className="hint";ht.textContent="drop gear here";dock.appendChild(ht)}
        w.appendChild(dock);wrap.appendChild(w);
      }else wrap.appendChild(mkChip(it,q,false));
    });
    box.appendChild(wrap);grid.appendChild(box);
  });
  var f=$("find");
  if(!q)f.textContent="";
  else if(!hits.length)f.textContent="No items match “"+$("search").value.trim()+"”.";
  else{
    f.textContent="";
    hits.forEach(function(i,ix){
      if(ix){var sp=document.createElement("span");sp.textContent="   ·   ";f.appendChild(sp)}
      var a=document.createElement("span");a.className="fn";a.textContent=i.name;f.appendChild(a);
      f.appendChild(document.createTextNode(" → "));
      var L=eloc(i),c=COL[L]||"#00e5ff",l=document.createElement("span");
      l.className="fl";l.textContent=locLabel(L);l.style.color=c;l.style.textShadow="0 0 10px "+c;f.appendChild(l);
      var pp=parentOf(i);
      if(pp){var cs=document.createElement("span");cs.textContent=" (on "+items[pp].name+")";cs.style.color=itemColor(items[pp].name);f.appendChild(cs)}
    });
  }
}

var lastDropped=null,RM=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
function attachDrag(el){
  el.addEventListener("pointerdown",function(ev){
    if(ev.button>0)return;
    var sx=ev.clientX,sy=ev.clientY,moved=false,ghost=null,overEl=null,id=el.dataset.id;
    var dragIsCart=isCart(items[id]);
    var tx=sx,ty=sy,gx=sx,gy=sy,raf=0;
    try{el.setPointerCapture(ev.pointerId)}catch(e){}
    function loop(){
      var dx=tx-gx,dy=ty-gy,k=RM?1:0.3;
      gx+=dx*k;gy+=dy*k;
      var rot=RM?0:Math.max(-16,Math.min(16,dx*0.7));
      ghost.style.left=gx+"px";ghost.style.top=gy+"px";
      ghost.style.transform="translate(-50%,-50%) scale(1.14) rotate("+rot+"deg)";
      raf=requestAnimationFrame(loop);
    }
    function move(e){
      tx=e.clientX;ty=e.clientY;
      if(!moved&&Math.hypot(tx-sx,ty-sy)>6){
        moved=true;dragging=true;
        var r=el.getBoundingClientRect();gx=r.left+r.width/2;gy=r.top+r.height/2;
        ghost=el.cloneNode(true);ghost.classList.add("ghost");
        ghost.style.left=gx+"px";ghost.style.top=gy+"px";
        document.body.appendChild(ghost);el.classList.add("lift");
        raf=requestAnimationFrame(loop);
      }
      if(moved){
        var t=document.elementFromPoint(tx,ty);
        var b=null;
        if(t&&t.closest){
          var cw=dragIsCart?null:t.closest("[data-cart]");
          if(cw&&cw.dataset.cart===id)cw=null;
          b=cw||t.closest("[data-loc]");
        }
        if(b!==overEl){if(overEl)overEl.classList.remove("over");overEl=b;if(b)b.classList.add("over")}
      }
    }
    function up(e){
      el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);
      if(!moved){if(e.type==="pointerup")tap(id);return}
      cancelAnimationFrame(raf);
      if(overEl)overEl.classList.remove("over");
      var tEl=overEl&&e.type!=="pointercancel"?overEl:null;
      var it=items[id],dest=null;
      if(tEl&&it){
        dest=tEl;
        if(tEl.dataset.cart){
          var cid=tEl.dataset.cart;
          if(it.parent!==cid||!parentOf(it))writeDoc(id,{parent:cid,loc:items[cid].loc||UN,ts:Date.now()});
        }else{
          var target=tEl.dataset.loc;
          if(isCart(it)){if(target!==eloc(it))moveCart(id,target)}
          else if(parentOf(it)||target!==eloc(it))writeDoc(id,{parent:"",loc:target,ts:Date.now()});
        }
      }
      // glide the item into place (or back home) before the board redraws
      var rr=(dest||el).getBoundingClientRect();
      var dur=RM?0:290;
      if(dur){
        ghost.style.transition="left "+dur+"ms cubic-bezier(.2,.9,.3,1.15),top "+dur+"ms cubic-bezier(.2,.9,.3,1.15),transform "+dur+"ms ease-out,opacity "+dur+"ms ease-in";
        ghost.style.left=(rr.left+rr.width/2)+"px";ghost.style.top=(rr.top+Math.min(rr.height/2,60))+"px";
        ghost.style.transform="translate(-50%,-50%) scale(.92) rotate(0deg)";ghost.style.opacity="0.25";
      }
      setTimeout(function(){
        if(ghost)ghost.remove();
        dragging=false;pendingRender=false;
        lastDropped=dest?id:null;render();
        setTimeout(function(){lastDropped=null},600);
      },dur+10);
    }
    el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
}

function moveCart(id,target){
  if(!db){toast("Not connected yet");return}
  var ts=Date.now(),bt=writeBatch(fs);
  var ids=[id].concat(Object.keys(items).filter(function(k){return items[k].parent===id}));
  ids.forEach(function(k){items[k]=Object.assign({},items[k],{loc:target,ts:ts});bt.update(doc(fs,"items",k),{loc:target,ts:ts})});
  bt.commit().catch(function(){toast("Couldn’t save change")});
}

function writeDoc(id,data){
  if(!db){toast("Not connected yet");return Promise.resolve()}
  // optimistic local update for snappy UI
  items[id]=Object.assign({},items[id],data);
  return db.doc("items/"+id).update(data).catch(function(err){
    toast(err&&err.code==="permission_denied"?"You have view-only access":"Couldn’t save change");
  });
}

var editOrig={loc:"",parent:""};
var lastTap={id:null,t:0},tapTimer=null,noteId=null;
function tap(id){var now=Date.now();var ti=items[id];
  if(ti&&ti.notes&&ti.notes.trim()){clearTimeout(tapTimer);lastTap={id:null,t:0};openNotes(id);return}
  if(lastTap.id===id&&now-lastTap.t<350){clearTimeout(tapTimer);lastTap={id:null,t:0};openNotes(id);return}
  lastTap={id:id,t:now};clearTimeout(tapTimer);tapTimer=setTimeout(function(){openEdit(id)},350)}
function openNotes(id){
  if(!items[id])return;
  noteId=id;$("noteTitle").textContent="Notes · "+items[id].name;
  $("noteText").value=items[id].notes||"";$("noteModal").classList.add("on");
}
function closeNotes(){$("noteModal").classList.remove("on");noteId=null}
$("noteCancel").onclick=closeNotes;
$("noteEdit").onclick=function(){var id=noteId;closeNotes();if(id)openEdit(id)};
$("noteModal").addEventListener("click",function(e){if(e.target===$("noteModal"))closeNotes()});
$("noteSave").onclick=function(){if(!noteId)return;writeDoc(noteId,{notes:$("noteText").value.trim(),ts:Date.now()});closeNotes();render()};
$("noteClear").onclick=function(){if(!noteId)return;writeDoc(noteId,{notes:"",ts:Date.now()});closeNotes();render()};
["😀","👍","⚠️","🔧","🔋","📦","✅","❌","🔌","🎤","🔍","🛠️"].forEach(function(em){
  var b=document.createElement("button");b.type="button";b.textContent=em;
  b.onclick=function(){var t=$("noteText"),a=t.selectionStart||0,z=t.selectionEnd||0;t.value=t.value.slice(0,a)+em+t.value.slice(z);t.focus();t.selectionStart=t.selectionEnd=a+em.length};
  $("emo").appendChild(b)});
$("notesBtn").onclick=function(){var id=editId;closeEdit();openNotes(id)};
function openEdit(id){
  if(!items[id])return;
  editId=id;$("editName").value=items[id].name;$("editLoc").value=eloc(items[id]);
  var ps=$("editParent");ps.textContent="";
  var o0=document.createElement("option");o0.value="";o0.textContent="Not attached to a cart";ps.appendChild(o0);
  Object.keys(items).filter(function(k){return isCart(items[k])&&k!==id}).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent="Attached to "+items[k].name;ps.appendChild(o)});
  ps.style.display=(isCart(items[id])||ps.options.length<2)?"none":"";
  $("editAudio").checked=!!items[id].audio;$("editVideo").checked=!!items[id].video;
  ps.value=parentOf(items[id]);editOrig={loc:eloc(items[id]),parent:parentOf(items[id])};
  $("delBtn").textContent="Delete";$("delBtn").dataset.arm="";
  $("modal").classList.add("on");
}
function closeEdit(){$("modal").classList.remove("on");editId=null}
$("cancelBtn").onclick=closeEdit;
$("modal").addEventListener("click",function(e){if(e.target===$("modal"))closeEdit()});
$("saveBtn").onclick=function(){
  var nm=$("editName").value.trim();if(!nm||!editId)return;
  var it=items[editId],nl=$("editLoc").value,np=$("editParent").value,ts=Date.now(),ka=$("editAudio").checked,kv=$("editVideo").checked;
  if(isCart(it)){writeDoc(editId,{name:nm,audio:ka,video:kv,ts:ts});if(nl!==eloc(it))moveCart(editId,nl)}
  else{
    if(np&&np===editOrig.parent&&nl!==editOrig.loc)np="";
    if(np&&items[np])writeDoc(editId,{name:nm,audio:ka,video:kv,parent:np,loc:items[np].loc||UN,ts:ts});
    else writeDoc(editId,{name:nm,audio:ka,video:kv,parent:"",loc:nl,ts:ts});
  }
  closeEdit();render();
};
$("delBtn").onclick=function(){
  var b=$("delBtn");
  if(!b.dataset.arm){b.dataset.arm="1";b.textContent="Tap again to confirm";return}
  var id=editId;closeEdit();
  delete items[id];render();
  db&&db.doc("items/"+id).delete().catch(function(){toast("Couldn’t delete")});
};

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item"}
$("addBtn").onclick=function(){
  var nm=$("newName").value.trim();if(!nm)return;
  if(!db){toast("Not connected yet");return}
  var dup=Object.keys(items).some(function(k){return items[k].name.toLowerCase()===nm.toLowerCase()});
  if(dup){toast("An item with that name already exists");return}
  var id=slug(nm);if(items[id])id+="-"+Date.now().toString(36);
  var data={name:nm,loc:$("newLoc").value,audio:$("newAudio").checked,video:$("newVideo").checked,ts:Date.now()};
  items[id]=data;render();$("newName").value="";$("newAudio").checked=false;$("newVideo").checked=false;
  db.doc("items/"+id).set(data).catch(function(){toast("Couldn’t add item")});
};
$("newName").addEventListener("keydown",function(e){if(e.key==="Enter")$("addBtn").click()});
$("search").addEventListener("input",render);

function setStatus(){
  var n=Object.keys(items).length;
  $("status").textContent="Live · "+n+" item"+(n===1?"":"s")+" · changes sync to everyone";
}

render();
var SEED=["QL5-1","QL1-1","QL1-2","QL1-3","CiscoCodec-1","CiscoCodec-2","DM3","Bose1","Bose2","Bose3","Bose4","Bose5","Bose6","HopPack1","HopPack2","SDI_Switcher","HDMI_Switcher","DFBFloat","Podium (JWClear)","Podium (Metal)","Podium (Black)","Coffin1","Coffin2","Coffin3","Coffin4","Chubby","Jonny5","Ol'Trusty","ConverterKit","ConfMon1","ConfMon2","ConfMon3","ConfMon4","ClockTimer1","ClockTimer2","ClearCom","98\"_TV1","98\"_TV2","TF3","TF1","NEB1","NEB2","BIGFOOT","BIGFOOT Jr"];
var adapter={doc:function(p){var ref=doc(fs,p.split("/")[0],p.split("/")[1]);
  return {update:function(d){return updateDoc(ref,d)},set:function(d){return setDoc(ref,d)},delete:function(){return deleteDoc(ref)}}}};
var unsub=null;
function showLogin(msg){$("loginModal").classList.add("on");$("loginErr").textContent=msg||""}
function doLogin(){
  var em=$("loginEmail").value.trim(),pw=$("loginPass").value;
  if(!em||!pw){$("loginErr").textContent="Enter the team email and password.";return}
  $("loginBtn").disabled=true;
  signInWithEmailAndPassword(auth,em,pw).then(function(){$("loginPass").value=""}).catch(function(e){
    $("loginErr").textContent=(e&&(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found"||e.code==="auth/invalid-email"))?"Wrong email or password.":"Couldn’t sign in. Check your connection and try again.";
  }).finally(function(){$("loginBtn").disabled=false});
}
$("loginBtn").onclick=doLogin;
$("loginPass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
$("signout").onclick=function(){signOut(auth)};
var migrated=false;
function migrate(){
  getDoc(doc(fs,"meta","seed")).then(function(m){
    var v=m.exists()?(m.data().v||0):0;
    if(v>=5)return;
    var b=writeBatch(fs),cur={},names={};
    Object.keys(items).forEach(function(id){cur[id]=Object.assign({},items[id]);names[String(items[id].name).toLowerCase()]=1});
    if(v<2){
      [["switcher1","SDI_Switcher"],["switcher2","HDMI_Switcher"]].forEach(function(p){
        var it=cur[p[0]];
        if(it&&/^switcher\d$/i.test(it.name)){delete names[it.name.toLowerCase()];names[p[1].toLowerCase()]=1;cur[p[0]].name=p[1];b.update(doc(fs,"items",p[0]),{name:p[1],ts:Date.now()})}});
    }
    (v<3?SEED:(v<4?["BIGFOOT","BIGFOOT Jr"]:[])).forEach(function(n){var id=slug(n);if(!names[n.toLowerCase()]&&!cur[id]){cur[id]={name:n,loc:UN};b.set(doc(fs,"items",id),{name:n,loc:UN,ts:Date.now()});names[n.toLowerCase()]=1}});
    if(v<3){
      [["ql1-1","neb1"],["ql1-2","neb2"]].forEach(function(p){
        var q=cur[p[0]],c=cur[p[1]];
        if(q&&c&&!q.parent){b.update(doc(fs,"items",p[0]),{parent:p[1],loc:c.loc||UN,ts:Date.now()})}});
    }
    if(v<5){
      [["tio-stagebox-1","TIO Stagebox"],["tio-stagebox-2","TIO Stagebox"],["rio1608-stagebox-1","RIO1608 Stagebox"],["rio1608-stagebox-2","RIO1608 Stagebox"],["shure-ulx-2pac-g","Shure ULX 2Pac G*"],["shure-ad-2pac","Shure AD 2Pac"]].forEach(function(p){
        if(!cur[p[0]]){cur[p[0]]={name:p[1],loc:UN};b.set(doc(fs,"items",p[0]),{name:p[1],loc:UN,audio:true,video:false,ts:Date.now()})}});
    }
    b.set(doc(fs,"meta","seed"),{v:5});
    return b.commit();
  }).catch(function(){});
}
onAuthStateChanged(auth,function(user){
  if(unsub){unsub();unsub=null}
  if(!user){db=null;items={};loaded=false;$("signout").style.display="none";migrated=false;$("status").textContent="Signed out";render();showLogin();return}
  $("loginModal").classList.remove("on");$("signout").style.display="";db=adapter;
  $("status").textContent="Connecting…";
  unsub=onSnapshot(collection(fs,"items"),function(snap){
    loaded=true;
    var next={};
    snap.docs.forEach(function(d){next[d.id]=d.data()||{}});
    items=next;setStatus();render();
    if(!migrated&&!snap.metadata.fromCache){migrated=true;migrate()}
  },function(){$("status").textContent="Lost connection to shared data."});
});
})();
